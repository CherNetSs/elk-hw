input {
  file {
    id => "nginx_access_file"
    path => "/var/log/nginx-lab/access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/nginx.sincedb"
    codec => json
    ecs_compatibility => "v8"
  }
}
filter {
  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
    remove_field => ["time"]
  }
  mutate { add_field => { "[labels][shipper]" => "logstash" } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-logstash-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}
