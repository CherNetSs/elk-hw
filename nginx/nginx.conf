worker_processes 1;
error_log /var/log/nginx-lab/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format elk_json escape=json
    '{"time":"$time_iso8601",'
    '"client":{"ip":"$remote_addr"},'
    '"http":{"request":{"method":"$request_method"},"response":{"status_code":$status,"body":{"bytes":$body_bytes_sent}}},'
    '"url":{"original":"$request_uri"},'
    '"user_agent":{"original":"$http_user_agent"},'
    '"event":{"dataset":"nginx.access"},'
    '"service":{"name":"nginx"}}';
  access_log /var/log/nginx-lab/access.log elk_json;
  server {
    listen 80;
    server_name _;
    location = / { default_type text/plain; return 200 "ELK homework: Nginx access logs\n"; }
    location /lab/ { default_type text/plain; return 200 "ELK logging lab\n"; }
    location = /missing { return 404; }
  }
}
