name: elk-hw

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.19.6}
    environment:
      cluster.name: ${CLUSTER_NAME:-elk-chernez-c7e92a}
      node.name: es01
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    mem_limit: 3g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped
    logging: *logging

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.19.6}
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "elk-homework-encryption-key-c7e92a-2026"
    mem_limit: 2g
    ports:
      - "${SERVER_IP:-192.168.1.13}:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:${NGINX_VERSION:-1.28.0}
    mem_limit: 128m
    ports:
      - "${SERVER_IP:-192.168.1.13}:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-access-logs:/var/log/nginx-lab
    restart: unless-stopped
    logging: *logging

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.19.6}
    profiles: ["logstash"]
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_WORKERS: "1"
    mem_limit: 1536m
    volumes:
      - ./logstash/nginx.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - nginx-access-logs:/var/log/nginx-lab:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.19.6}
    profiles: ["filebeat"]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    mem_limit: 256m
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx-access-logs:/var/log/nginx-lab:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  es-data:
  nginx-access-logs:
  logstash-data:
  filebeat-data:
